<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Weekly allowance: <strong>200 EUR</strong></p>
  </header>

  <section class="card main-card">
    <div class="budget-display">
      <div class="budget-label">Remaining Budget</div>
      <div class="budget-amount" id="remaining">1000.00 EUR</div>
      <div class="budget-sub" id="weeksLeft">5.0 weeks of allowance left</div>
    </div>
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label"><span id="progressPct">0</span>% of weekly allowance used</div>
  </section>

  <section class="card">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <div class="form-group">
        <label for="amount">Amount (EUR)</label>
        <input type="number" id="amount" placeholder="e.g. 25.50" min="0.01" step="0.01" required>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="Food">🍞 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Bills">💡 Bills</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Health">💊 Health</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="type">Type</label>
        <select id="type">
          <option value="one-time">One-time</option>
          <option value="subscription">Subscription</option>
          <option value="recurring">Recurring</option>
        </select>
      </div>
      <button type="submit" class="btn">Add Expense</button>
    </form>
  </section>

  <section class="card">
    <h2>Expenses</h2>
    <ul id="expenseList" class="expense-list"></ul>
    <p class="empty-msg" id="emptyMsg">No expenses yet. Add your first one!</p>
  </section>

  <footer class="footer">
    <p>Total budget: 1000 EUR &middot; Weekly allowance: 200 EUR</p>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
